name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lua:
    name: Lua 5.1
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Check Lua syntax
        run: find . -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Run automated tests
        run: lua5.1 tests/run.lua

  windows-installer:
    name: Windows development installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Exercise idempotent junction install
        shell: pwsh
        run: |
          $wowRoot = Join-Path $env:RUNNER_TEMP "wow-test\_classic_beta_"
          New-Item -ItemType Directory -Path (Join-Path $wowRoot "Interface\AddOns") -Force | Out-Null
          ./tools/Install-Dev.ps1 -WowRoot $wowRoot
          ./tools/Install-Dev.ps1 -WowRoot $wowRoot

          $destination = Join-Path $wowRoot "Interface\AddOns\AsgardsGuildTitheDev"
          $item = Get-Item -LiteralPath $destination -Force
          if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
            throw "Development install is not a junction."
          }

          $blockedRoot = Join-Path $env:RUNNER_TEMP "wow-blocked\_classic_beta_"
          $blockedDestination = Join-Path $blockedRoot "Interface\AddOns\AsgardsGuildTitheDev"
          New-Item -ItemType Directory -Path $blockedDestination -Force | Out-Null
          $refused = $false
          try {
            ./tools/Install-Dev.ps1 -WowRoot $blockedRoot
          } catch {
            $refused = $true
          }
          if (-not $refused) {
            throw "Installer replaced an existing real directory."
          }
