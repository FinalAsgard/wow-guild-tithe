name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lua:
    name: Lua 5.1
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Check Lua syntax
        run: find . -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Run automated tests
        run: lua5.1 tests/run.lua

  package:
    name: Release package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate the multi-client package without uploading
        run: tools/build-package.sh

  windows-installer:
    name: Windows development installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Exercise Forever and Retail junction installs
        shell: pwsh
        run: ./tests/Install-Dev.Tests.ps1
