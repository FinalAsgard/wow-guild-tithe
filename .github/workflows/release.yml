name: Release

# Pushing a version tag (for example v0.2.0, or v0.2.0-beta1 for a beta)
# tests, packages, and uploads the add-on to CurseForge for both clients.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish to CurseForge
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches the manifest versions
        run: tools/check-release-tag.sh "$GITHUB_REF_NAME"

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Check Lua syntax
        run: find . -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Run automated tests
        run: lua5.1 tests/run.lua

      - name: Build and validate the package without uploading
        run: tools/build-package.sh

      - name: Upload to CurseForge and GitHub
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
        run: tools/publish-release.sh
